<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="hardware.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <title>spectools</title>
  </head>
  <body>
    <div class="top-bar">
      <h1>spec<span class="purple">tools</span></h1>
      <p>
        your hardware specs in the comfort of your browser
        <span title="*not firefox">*</span>
      </p>
    </div>
    <div class="cards-container">
      <div class="card">
        <h2>CPU:</h2>
        <p>totally real cpu</p>
      </div>
      <div class="card">
        <h2>GPU:</h2>
        <p id="GPU-vendor">Vendor:</p>
        <p id="GPU-renderer">GPU:</p>
      </div>
      <div class="card">
        <h2>RAM:</h2>
        <p id="RAM-total">Total: </p>
      </div>
      <div class="card">
        <h2>Misc:</h2>
        <p id="OS-type">OS:</p>
        <p id="browser-type">Browser:</p>
      </div>
    </div>
    <canvas id="info-canvas" width="0" height="0"></canvas>
  </body>
</html>
